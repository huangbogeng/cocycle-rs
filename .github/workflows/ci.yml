name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Format, lint and docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/check_docs.py
      - run: cargo fmt --all -- --check
      - run: rustfmt --edition 2024 --check tools/diagram_dump.rs tools/benchmark_driver.rs
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo build --locked
      - run: rustdoc --edition 2024 --test README.md --extern cocycle=target/debug/libcocycle.rlib -L dependency=target/debug/deps
      - run: rustdoc --edition 2024 --test docs/guide.md --extern cocycle=target/debug/libcocycle.rlib -L dependency=target/debug/deps
      - run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --all-features
      - run: cargo test --locked --release --all-features
      - run: cargo run --locked --example square

  msrv:
    name: Minimum Rust (1.91)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
      - run: cargo test --locked --all-features
      - run: cargo check --locked --all-targets --all-features

  package:
    name: Package and packaged example
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo package --locked
      - run: cargo run --locked --manifest-path target/package/cocycle-0.1.0/Cargo.toml --example square

  reference:
    name: Independent TDA comparisons
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            tools/requirements-reference.txt
            tools/requirements-gudhi.txt
            tools/requirements-benchmark.txt
      - run: python -m pip install -r tools/requirements-benchmark.txt
      - run: python tools/compare_ripser.py
      - run: python -m unittest discover -s tools -p 'test_*.py'
      - run: python tools/benchmark_gudhi.py --quick --samples 1 --output target/gudhi-smoke
      - run: python tools/benchmark_gudhi.py --include-ripser --quick --samples 1 --output target/ripser-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-comparisons
          if-no-files-found: ignore
          retention-days: 14
          path: |
            target/gudhi-smoke
            target/ripser-smoke
